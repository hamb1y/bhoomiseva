# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Sveltia CMS — Git-based content editing for the Bhoomi Seva site.
#
# Open http://localhost:4322/admin/index.html while `bun run dev` is running.
# In a Chromium browser, choose “Work with Local Repository” to edit the files
# in this repo directly. In production, the GitHub backend opens pull requests
# or commits straight to the branch below.
#
# Content files are the source of truth. The site reads them at build time via
# `import.meta.glob` in src/data/*.ts — see AGENTS.md.

backend:
  name: github
  repo: hamb1y/bhoomiseva
  branch: main
  base_url: https://bhoomiseva-sveltia-auth.rishi-s-malnad.workers.dev
  auth_scope: public_repo

site_url: https://bhoomiseva.org
display_url: https://bhoomiseva.org
logo_url: ../images/logo-mark.webp

# Images are committed alongside the code, served from /images.
media_folder: public/images
public_folder: /images

# English + Kannada, both stored in one file per entry: { en: {...}, kn: {...} }
i18n:
  structure: single_file
  locales: [en, kn]
  default_locale: en

# Optional fields are omitted from the file when empty, which keeps the JSON
# readable and lets the site’s fallbacks apply.
output:
  omit_empty_optional_fields: true

collections:
  # ---------------------------------------------------------------- stories ---
  - name: stories
    label: Stories
    label_singular: Story
    description: >-
      Longer narratives about a student, a farmer or a family. Always dated or
      given a period, and always located.
    folder: content/stories
    create: true
    format: json
    i18n: true
    identifier_field: title
    sortable_fields: [title, date]
    view_filters:
      - { label: Education, field: program, pattern: education }
      - { label: Farmers, field: program, pattern: farmers }
      - { label: Children, field: program, pattern: children }
    fields:
      - { label: Title, name: title, widget: string, i18n: true }
      - { label: Summary, name: summary, widget: text, i18n: true }
      - label: Body
        name: body
        widget: list
        i18n: true
        label_singular: Paragraph
        field: { label: Paragraph, name: paragraph, widget: text }
        hint: One paragraph per item. Four to six reads well.
      - label: Quote
        name: quote
        widget: object
        i18n: true
        required: false
        hint: A testimonial or letter reproduced from the source.
        fields:
          - { label: Quote, name: text, widget: text }
          - { label: Attribution, name: attribution, widget: string }
      - label: People
        name: people
        widget: list
        required: false
        i18n: duplicate
        field: { label: Name, name: name, widget: string }
      - { label: Photo, name: image, widget: image, required: false, i18n: duplicate }
      - { label: Photo description, name: image_alt, widget: string, i18n: true, required: false }
      - label: Photo position
        name: image_position
        widget: select
        required: false
        default: center
        options: [center, top, bottom, left, right]
        i18n: duplicate
        hint: Which part of the photo to keep when the site crops it.
      - { label: Programme, name: program, widget: select, options: [education, farmers, children], i18n: duplicate }
      - label: Date
        name: date
        widget: string
        required: false
        i18n: duplicate
        hint: "YYYY-MM or YYYY-MM-DD. Leave blank if unknown."
      - { label: Period, name: period, widget: string, i18n: true, required: false }
      - { label: Location, name: location, widget: string, i18n: true }
      - { label: Featured, name: featured, widget: boolean, default: false, required: false, i18n: duplicate }

  # ----------------------------------------------------------------- events ---
  - name: events
    label: Events
    label_singular: Event
    description: Short dated records of things that happened — training, distributions, donations, meals.
    folder: content/events
    create: true
    format: json
    i18n: true
    identifier_field: title
    sortable_fields: [title, date]
    fields:
      - { label: Title, name: title, widget: string, i18n: true }
      - { label: Summary, name: summary, widget: text, i18n: true }
      - label: Body
        name: body
        widget: list
        i18n: true
        label_singular: Paragraph
        field: { label: Paragraph, name: paragraph, widget: text }
      - label: People
        name: people
        widget: list
        required: false
        i18n: duplicate
        field: { label: Name, name: name, widget: string }
      - { label: Photo, name: image, widget: image, required: false, i18n: duplicate }
      - { label: Photo description, name: image_alt, widget: string, i18n: true, required: false }
      - label: Photo position
        name: image_position
        widget: select
        required: false
        default: center
        options: [center, top, bottom, left, right]
        i18n: duplicate
      - { label: Programme, name: program, widget: select, options: [education, farmers, children], i18n: duplicate }
      - label: Date
        name: date
        widget: string
        required: false
        i18n: duplicate
        hint: "YYYY-MM or YYYY-MM-DD."
      - { label: Period, name: period, widget: string, i18n: true, required: false }
      - { label: Location, name: location, widget: string, i18n: true }

  # ------------------------------------------------------------------ blogs ---
  - name: blogs
    label: Blogs
    label_singular: Blog post
    description: >-
      Writing from people involved in the work. Donor blogs are written by
      supporters; donee blogs are written by the people we work with. Both share
      one layout and are split by the Blogs menu on the site.
    folder: content/blogs
    create: true
    format: json
    i18n: true
    identifier_field: title
    sortable_fields: [title, date]
    view_filters:
      - { label: Donor blogs, field: kind, pattern: donor }
      - { label: Donee blogs, field: kind, pattern: donee }
    fields:
      - { label: Title, name: title, widget: string, i18n: true }
      - { label: Summary, name: summary, widget: text, i18n: true }
      - label: Body
        name: body
        widget: list
        i18n: true
        label_singular: Paragraph
        field: { label: Paragraph, name: paragraph, widget: text }
      - label: Kind
        name: kind
        widget: select
        i18n: duplicate
        options:
          - { label: Donor blog, value: donor }
          - { label: Donee blog, value: donee }
        hint: Donor = written by a supporter. Donee = written by someone we work with.
      - { label: Author, name: author, widget: string, i18n: duplicate }
      - { label: Author role, name: author_role, widget: string, i18n: true, required: false }
      - { label: Photo, name: image, widget: image, required: false, i18n: duplicate }
      - { label: Photo description, name: image_alt, widget: string, i18n: true, required: false }
      - label: Photo position
        name: image_position
        widget: select
        required: false
        default: center
        options: [center, top, bottom, left, right]
        i18n: duplicate
      - { label: Date, name: date, widget: string, required: false, hint: "YYYY-MM-DD", i18n: duplicate }
      - { label: Location, name: location, widget: string, i18n: true, required: false }
      - { label: Featured, name: featured, widget: boolean, default: false, required: false, i18n: duplicate }

  # --------------------------------------------------------------- programs ---
  - name: programs
    label: Programmes
    label_singular: Programme
    description: The three programme pages. There are normally exactly three.
    folder: content/programs
    format: json
    i18n: true
    identifier_field: key
    slug: "{{fields.key}}"
    fields:
      - label: Key
        name: key
        widget: select
        options: [education, farmers, children]
        hint: Stable identifier used by the site. Do not change once set.
      - label: Accent
        name: accent
        widget: select
        options: [brand, education, farmers, children]
        default: brand
        i18n: duplicate
      - { label: Kicker, name: kicker, widget: string, i18n: true }
      - { label: Title, name: title, widget: string, i18n: true }
      - { label: Summary, name: summary, widget: text, i18n: true }
      - { label: Introduction, name: lede, widget: text, i18n: true }
      - label: Activities
        name: activities
        widget: list
        i18n: true
        label_singular: Activity
        summary: "{{fields.title}}"
        fields:
          - { label: Title, name: title, widget: string, i18n: true }
          - { label: Description, name: body, widget: text, i18n: true }
      - { label: Photo, name: image, widget: image, required: false, i18n: duplicate }
      - { label: Photo description, name: image_alt, widget: string, i18n: true, required: false }
      - label: Gallery
        name: gallery
        widget: list
        required: false
        i18n: duplicate
        label_singular: Photo
        field: { label: Photo, name: image, widget: image }

  # ------------------------------------------------------------------- team ---
  - name: team
    label: People
    label_singular: Person
    description: The people listed on the About page.
    folder: content/team
    format: json
    i18n: true
    identifier_field: name
    sortable_fields: [order, name]
    fields:
      - { label: Name, name: name, widget: string, i18n: duplicate }
      - { label: Role, name: role, widget: string, i18n: true }
      - { label: Bio, name: bio, widget: text, i18n: true }
      - { label: Photo, name: photo, widget: image, required: false, i18n: duplicate }
      - label: Photo position
        name: photo_position
        widget: select
        required: false
        default: center
        options: [center, top, bottom, left, right]
        i18n: duplicate
      - {
          label: Order,
          name: order,
          widget: number,
          default: 0,
          value_type: int,
          hint: Lower numbers appear first.,
          i18n: duplicate,
        }

  # --------------------------------------------------------------- settings ---
  - name: settings
    label: Site settings
    description: Contact details, mission, vision and the About text.
    i18n: true
    files:
      - name: site
        label: Site settings
        file: content/settings.json
        i18n: true
        fields:
          - { label: Name, name: name, widget: string, i18n: duplicate }
          - { label: Email, name: email, widget: string, i18n: duplicate }
          - { label: Phone, name: phone, widget: string, i18n: duplicate }
          - {
              label: Phone (link),
              name: phone_href,
              widget: string,
              hint: "Digits only, e.g. +919900103178",
              i18n: duplicate,
            }
          - { label: WhatsApp URL, name: whatsapp, widget: string, required: false, i18n: duplicate }
          - label: Social links
            name: socials
            widget: object
            required: false
            i18n: duplicate
            fields:
              - { label: Facebook, name: facebook, widget: string, required: false }
              - { label: WhatsApp group, name: whatsapp_group, widget: string, required: false }
          - label: Payment details
            name: payment
            widget: object
            i18n: duplicate
            fields:
              - { label: UPI ID, name: upi, widget: string }
              - { label: Paytm, name: paytm, widget: string }
              - { label: Google Pay, name: gpay, widget: string }
              - label: Verified
                name: verified
                widget: boolean
                default: false
                hint: Tick only once the payment details have been confirmed current.
          - label: Suggested donation amounts
            name: donation_amounts
            widget: object
            i18n: duplicate
            hint: "Rupee amounts offered on the Donate page for each cause. The second one is picked first."
            fields:
              - { label: "Education", name: education, widget: list, field: { label: Amount, name: amount, widget: number, value_type: int } }
              - { label: "Farmer support", name: farmers, widget: list, field: { label: Amount, name: amount, widget: number, value_type: int } }
              - { label: "Cow donation", name: cow, widget: list, field: { label: Amount, name: amount, widget: number, value_type: int } }
              - { label: "Orphanage meal", name: children, widget: list, field: { label: Amount, name: amount, widget: number, value_type: int } }
              - { label: "Any", name: any, widget: list, field: { label: Amount, name: amount, widget: number, value_type: int } }
          - { label: Mission, name: mission, widget: text, i18n: true }
          - { label: Vision, name: vision, widget: text, i18n: true }
          - { label: Short description, name: short_description, widget: text, i18n: true }
          - label: About
            name: about
            widget: list
            i18n: true
            label_singular: Paragraph
            field: { label: Paragraph, name: paragraph, widget: text }
          - label: About photos
            name: about_photos
            widget: list
            i18n: true
            required: false
            label_singular: Photo
            hint: Photographs of recent work shown on the About page, newest first. The first one opens the page.
            fields:
              - { label: Photo, name: image, widget: image, i18n: duplicate }
              - { label: Caption, name: caption, widget: string, i18n: true }
              - { label: Month, name: date, widget: string, hint: "YYYY-MM", pattern: ['^\\d{4}-\\d{2}$', "Use YYYY-MM"], i18n: duplicate }
          - {
              label: Credit,
              name: credit,
              widget: string,
              required: false,
              hint: "Who built the site.",
              i18n: duplicate,
            }
          - { label: Credit link, name: credit_url, widget: string, required: false, i18n: duplicate }

      - name: copy
        label: Interface text
        file: content/copy.json
        i18n: true
        description: "Headings, introductions, buttons and labels across the site. Each section is one page or part of the page."
        fields:
          - name: "site"
            label: "Site"
            widget: object
            i18n: true
            collapsed: true
            fields:
              - { name: "name", label: "Name", widget: string, i18n: true }
              - { name: "tagline", label: "Tagline", widget: string, i18n: true }
          - name: "common"
            label: "Shared labels"
            widget: object
            i18n: true
            collapsed: true
            fields:
              - { name: "readEntry", label: "Read entry", widget: string, i18n: true }
              - { name: "dateUnknown", label: "Date unknown", widget: string, i18n: true }
              - { name: "relatedStories", label: "Related stories", widget: string, i18n: true }
          - name: "a11y"
            label: "Accessibility labels"
            widget: object
            i18n: true
            collapsed: true
            fields:
              - { name: "skip", label: "Skip", widget: string, i18n: true }
          - name: "lightbox"
            label: "Photo viewer"
            widget: object
            i18n: true
            collapsed: true
            fields:
              - { name: "close", label: "Close", widget: string, i18n: true }
              - { name: "prev", label: "Prev", widget: string, i18n: true }
              - { name: "next", label: "Next", widget: string, i18n: true }
          - name: "nav"
            label: "Navigation"
            widget: object
            i18n: true
            collapsed: true
            fields:
              - { name: "home", label: "Home", widget: string, i18n: true }
              - name: "work"
                label: "Our work pages"
                widget: object
                i18n: true
                collapsed: true
                fields:
                  - { name: "self", label: "Work", widget: string, i18n: true }
                  - { name: "education", label: "Education", widget: string, i18n: true }
                  - { name: "farmers", label: "Farmers", widget: string, i18n: true }
                  - { name: "children", label: "Children", widget: string, i18n: true }
              - { name: "stories", label: "Stories", widget: string, i18n: true }
              - { name: "about", label: "About", widget: string, i18n: true }
              - { name: "involved", label: "Involved", widget: string, i18n: true }
              - { name: "donate", label: "Donate", widget: string, i18n: true }
              - { name: "contact", label: "Contact", widget: string, i18n: true }
              - { name: "events", label: "Events", widget: string, i18n: true }
              - name: "blogs"
                label: "Blogs pages"
                widget: object
                i18n: true
                collapsed: true
                fields:
                  - { name: "self", label: "Blogs", widget: string, i18n: true }
                  - { name: "donors", label: "Donors", widget: string, i18n: true }
                  - { name: "donees", label: "Donees", widget: string, i18n: true }
              - { name: "menu", label: "Menu", widget: string, i18n: true }
              - { name: "close", label: "Close", widget: string, i18n: true }
          - name: "cta"
            label: "Buttons"
            widget: object
            i18n: true
            collapsed: true
            fields:
              - { name: "donate", label: "Donate", widget: string, i18n: true }
              - { name: "volunteer", label: "Volunteer", widget: string, i18n: true }
              - { name: "readStories", label: "Read stories", widget: string, i18n: true }
              - { name: "learnMore", label: "Learn more", widget: string, i18n: true }
              - { name: "allStories", label: "All stories", widget: string, i18n: true }
              - { name: "allEvents", label: "All events", widget: string, i18n: true }
              - { name: "whatsapp", label: "Whatsapp", widget: string, i18n: true }
          - name: "home"
            label: "Home page"
            widget: object
            i18n: true
            collapsed: true
            fields:
              - name: "hero"
                label: "Hero"
                widget: object
                i18n: true
                collapsed: true
                fields:
                  - { name: "kicker", label: "Kicker", widget: string, i18n: true }
              - name: "pillars"
                label: "Pillars"
                widget: object
                i18n: true
                collapsed: true
                fields:
                  - { name: "title", label: "Title", widget: string, i18n: true }
              - name: "model"
                label: "Model"
                widget: object
                i18n: true
                collapsed: true
                fields:
                  - { name: "kicker", label: "Kicker", widget: string, i18n: true }
                  - { name: "title", label: "Title", widget: string, i18n: true }
                  - { name: "body", label: "Body", widget: text, i18n: true }
              - name: "updates"
                label: "Updates"
                widget: object
                i18n: true
                collapsed: true
                fields:
                  - { name: "title", label: "Title", widget: string, i18n: true }
              - name: "impact"
                label: "Impact"
                widget: object
                i18n: true
                collapsed: true
                fields:
                  - { name: "kicker", label: "Kicker", widget: string, i18n: true }
                  - { name: "title", label: "Title", widget: string, i18n: true }
                  - { name: "body", label: "Body", widget: text, i18n: true }
          - name: "work"
            label: "Our work pages"
            widget: object
            i18n: true
            collapsed: true
            fields:
              - { name: "kicker", label: "Kicker", widget: string, i18n: true }
              - { name: "title", label: "Title", widget: string, i18n: true }
              - { name: "lede", label: "Lede", widget: text, i18n: true }
              - { name: "includes", label: "Includes", widget: string, i18n: true }
              - { name: "stories", label: "Stories", widget: string, i18n: true }
              - { name: "otherProgrammes", label: "Other programmes", widget: string, i18n: true }
              - { name: "noStories", label: "No stories", widget: string, i18n: true }
          - name: "stories"
            label: "Stories page"
            widget: object
            i18n: true
            collapsed: true
            fields:
              - { name: "kicker", label: "Kicker", widget: string, i18n: true }
              - { name: "title", label: "Title", widget: string, i18n: true }
              - name: "filter"
                label: "Filter"
                widget: object
                i18n: true
                collapsed: true
                fields:
                  - { name: "programme", label: "Programme", widget: string, i18n: true }
                  - { name: "year", label: "Year", widget: string, i18n: true }
                  - { name: "all", label: "All", widget: string, i18n: true }
              - { name: "empty", label: "Empty", widget: string, i18n: true }
              - name: "count"
                label: "Count"
                widget: object
                i18n: true
                collapsed: true
                fields:
                  - { name: "self", label: "Count", widget: string, i18n: true, hint: "Keep {n} as written; the site fills it in." }
                  - { name: "one", label: "One", widget: string, i18n: true }
          - name: "story"
            label: "Story pages"
            widget: object
            i18n: true
            collapsed: true
            fields:
              - { name: "people", label: "People", widget: string, i18n: true }
              - { name: "quoteLabel", label: "Quote label", widget: string, i18n: true }
              - name: "record"
                label: "Record"
                widget: object
                i18n: true
                collapsed: true
                fields:
                  - { name: "date", label: "Date", widget: string, i18n: true }
                  - { name: "place", label: "Place", widget: string, i18n: true }
                  - { name: "author", label: "Author", widget: string, i18n: true }
          - name: "events"
            label: "Events page"
            widget: object
            i18n: true
            collapsed: true
            fields:
              - { name: "kicker", label: "Kicker", widget: string, i18n: true }
              - { name: "title", label: "Title", widget: string, i18n: true }
              - { name: "lede", label: "Lede", widget: text, i18n: true }
              - { name: "empty", label: "Empty", widget: string, i18n: true }
              - { name: "related", label: "Related", widget: string, i18n: true }
          - name: "blogs"
            label: "Blogs pages"
            widget: object
            i18n: true
            collapsed: true
            fields:
              - { name: "kicker", label: "Kicker", widget: string, i18n: true }
              - { name: "title", label: "Title", widget: string, i18n: true }
              - { name: "lede", label: "Lede", widget: text, i18n: true }
              - { name: "empty", label: "Empty", widget: string, i18n: true }
              - name: "donors"
                label: "Donors"
                widget: object
                i18n: true
                collapsed: true
                fields:
                  - { name: "title", label: "Title", widget: string, i18n: true }
                  - { name: "lede", label: "Lede", widget: text, i18n: true }
                  - { name: "empty", label: "Empty", widget: string, i18n: true }
              - name: "donees"
                label: "Donees"
                widget: object
                i18n: true
                collapsed: true
                fields:
                  - { name: "title", label: "Title", widget: string, i18n: true }
                  - { name: "lede", label: "Lede", widget: text, i18n: true }
                  - { name: "empty", label: "Empty", widget: string, i18n: true }
              - { name: "related", label: "Related", widget: string, i18n: true }
          - name: "about"
            label: "About page"
            widget: object
            i18n: true
            collapsed: true
            fields:
              - { name: "kicker", label: "Kicker", widget: string, i18n: true }
              - { name: "title", label: "Title", widget: string, i18n: true }
              - { name: "lede", label: "Lede", widget: text, i18n: true }
              - name: "record"
                label: "Record"
                widget: object
                i18n: true
                collapsed: true
                fields:
                  - { name: "self", label: "Record", widget: string, i18n: true }
                  - { name: "lede", label: "Lede", widget: text, i18n: true }
              - { name: "mission", label: "Mission", widget: string, i18n: true }
              - { name: "vision", label: "Vision", widget: string, i18n: true }
              - name: "team"
                label: "Team"
                widget: object
                i18n: true
                collapsed: true
                fields:
                  - { name: "self", label: "Team", widget: string, i18n: true }
                  - { name: "lede", label: "Lede", widget: text, i18n: true }
              - name: "community"
                label: "Community"
                widget: object
                i18n: true
                collapsed: true
                fields:
                  - { name: "self", label: "Community", widget: string, i18n: true }
                  - { name: "body", label: "Body", widget: text, i18n: true }
          - name: "involved"
            label: "Get involved page"
            widget: object
            i18n: true
            collapsed: true
            fields:
              - { name: "kicker", label: "Kicker", widget: string, i18n: true }
              - { name: "title", label: "Title", widget: string, i18n: true }
              - { name: "lede", label: "Lede", widget: text, i18n: true }
              - name: "volunteer"
                label: "Volunteer"
                widget: object
                i18n: true
                collapsed: true
                fields:
                  - { name: "title", label: "Title", widget: string, i18n: true }
                  - { name: "body", label: "Body", widget: text, i18n: true }
                  - { name: "cta", label: "Cta", widget: string, i18n: true }
              - name: "goods"
                label: "Goods"
                widget: object
